[project]
name = "pokedex_app"
version = "1.0.0"
description = "PokéDex SENAI - app de busca e favoritos de Pokémon"
authors = [{ name = "SENAI" }]
requires-python = ">=3.10"
dependencies = [
    "flet>=0.28.0",
    "httpx>=0.27.0",
]

[tool.flet]
# Identidade do pacote no Android (precisa ser único e em letras minúsculas)
org = "br.senai"
product = "PokeDex SENAI"
company = "SENAI"
copyright = "Copyright (c) 2026 SENAI"

# Caminho dos assets (ícones/splash). Pode deixar a pasta vazia por enquanto.
[tool.flet.app]
path = "."
exclude = [
    ".venv",
    ".idea",
    "__pycache__",
    "pokedex.db",
    "build",
    "*.pyc",
]
